name: Publish public beta to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node beta/system-version.mjs
      - run: node beta/build-readable-catalog.mjs
      - run: node beta/build-search-index.mjs --check
      - run: node beta/verify-pages.mjs
      - run: npm test
      - run: node beta/build-builder-library.mjs --out beta/site/builder-library.json --report
      # Builder 화면(B-20261006-04). 위 검증이 끝난 beta/site에 빌드 결과만 덧붙인다
      - run: npm ci
        working-directory: builder
      - run: npm run build
        working-directory: builder
      - run: mkdir -p beta/site/builder && cp -R builder/dist/. beta/site/builder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: beta/site
      - id: deployment
        uses: actions/deploy-pages@v4
