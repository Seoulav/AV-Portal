<!doctype html>
<html lang="ko">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
